
name: AI CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn joblib numpy

      - name: Run automated tests
        run: python -m unittest -v test_model.py

      - name: Retrain model
        run: python train_model.py

      - name: Verify model artifact
        run: |
          python -c "import os; assert os.path.exists('model.joblib'); print('Model verified')"

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-ai-model
          path: model.joblib
          if-no-files-found: error
